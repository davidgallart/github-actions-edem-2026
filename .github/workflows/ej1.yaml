# Variables de Entorno Globales: Crea un workflow que defina una variable de entorno a nivel de workflow y la use en dos jobs distintos.

name: Ejercicio 1
on:
  workflow_dispatch:

jobs:
  variable:
    name: "Variable Global" 
    runs-on: ubuntu-latest
    steps:
  - name: Debug
    env:
      MI_VAR: ${{ vars.VAR1 }}
    run: |
      if [ -z "$MI_VAR" ]; then
        echo "La variable está vacía o no está disponible"
      else
        echo "La variable existe y tiene valor"
      fi